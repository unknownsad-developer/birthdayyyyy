<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3d6; --bg2:#ffc4b0; --text:#1a1210; --accent:#d03a40;
  --env:#ffb0b0; --env-in:#fd9696; --paper:#fbeedd; --ink:#1d1613;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg1:#4a2326; --bg2:#2b1214; --text:#fff1ec; --accent:#ff7b82; }
}
:root[data-theme="dark"]{ --bg1:#4a2326; --bg2:#2b1214; --text:#fff1ec; --accent:#ff7b82; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg2);color:var(--text);font-family:'Montserrat',system-ui,sans-serif;overflow:hidden}
.stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 50%,var(--bg1) 0,var(--bg2) 75%)}
.caption{position:absolute;top:calc(12% + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;padding:0 7vw;
  font-weight:600;font-size:clamp(18px,4.6vw,26px);transition:opacity .5s}
.stage.reading .caption{opacity:0}
.footer{position:absolute;bottom:calc(5% + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;
  font-size:11px;letter-spacing:.08em;font-weight:600;color:var(--accent);text-transform:uppercase}

/* envelope: everything sized in em so it scales from one font-size */
.env{position:relative;width:10em;height:6.4em;font-size:min(7.6vw,34px);perspective:40em;margin-top:6vh;
  filter:drop-shadow(.22em .22em 0 rgba(110,40,40,.32))}
.env svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.env .poly{stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.back{z-index:1}.back .poly{fill:var(--env-in)}
.card{position:absolute;z-index:2;left:.8em;top:.9em;width:8.4em;height:5em;background:var(--paper);
  display:flex;align-items:center;justify-content:center;font-family:'Gochi Hand',cursive;font-size:.62em;color:var(--ink);
  transition:transform .9s cubic-bezier(.3,.8,.3,1),opacity .35s;box-shadow:0 .1em .4em rgba(0,0,0,.12)}
.card span{font-size:1.5em}
.front{z-index:3}.front .poly{fill:var(--env)}
.front line,.flap line{stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.flap{position:absolute;z-index:5;left:0;top:0;width:100%;height:3.6em;transform-origin:50% 0;color:var(--env)}
.flap svg .poly{fill:currentColor}
.seal{position:absolute;z-index:6;left:50%;top:3.2em;width:1.5em;height:1.4em;transform:translate(-50%,0);transition:opacity .25s;
  color:var(--accent);filter:none}
.seal svg{position:static;width:100%;height:100%}
.env.open .seal{opacity:0}
.env.open .flap{animation:flapOpen .8s forwards}
.env.closing .flap{animation:flapClose .8s forwards}
@keyframes flapOpen{0%{transform:rotateX(0);z-index:5;color:var(--env)}49%{z-index:5}50%{transform:rotateX(90deg);z-index:1;color:var(--env-in)}100%{transform:rotateX(180deg);z-index:1;color:var(--env-in)}}
@keyframes flapClose{0%{transform:rotateX(180deg);z-index:1;color:var(--env-in)}50%{transform:rotateX(90deg);z-index:1;color:var(--env-in)}51%{z-index:5;color:var(--env)}100%{transform:rotateX(0);z-index:5;color:var(--env)}}
.env.up .card{transform:translateY(-4.6em)}
.env.front .card{transform:translate(.2em,2.3em) rotate(-5deg);z-index:6}
.stage.reading .card{opacity:0}

/* the full letter */
.letter{position:absolute;left:50%;top:50%;z-index:20;width:min(88vw,420px);max-height:84dvh;overflow:auto;
  background:var(--paper);color:var(--ink);padding:7% 8% 8%;font-family:'Gochi Hand',cursive;
  font-size:clamp(13px,3.7vw,18px);line-height:1.45;box-shadow:0 .6em 2.4em rgba(90,30,30,.28);
  opacity:0;pointer-events:none;transform:translate(-50%,calc(-50% + 12vh)) scale(.3) rotate(-6deg);
  transition:transform .9s cubic-bezier(.3,.9,.3,1),opacity .5s}
.stage.reading .letter{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1) rotate(-2.2deg)}
.letter p{margin:0 0 1em}
.letter p:last-child{margin:0;white-space:pre-line}

.pause{position:absolute;z-index:30;top:calc(5% + env(safe-area-inset-top,0px));left:5vw;display:flex;align-items:center;gap:.5em;
  background:none;border:0;color:var(--accent);font:600 11px 'Montserrat',sans-serif;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
.stage.reading .pause{opacity:1;pointer-events:auto}
.pause i{width:26px;height:26px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center}
.pause svg{width:10px;height:10px;fill:var(--accent)}

.hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:15}
.hearts b{position:absolute;font-weight:400;line-height:1;opacity:0;animation:rise 2.4s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.4) rotate(0)}18%{opacity:1}100%{opacity:0;transform:translateY(-26vh) scale(1.1) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.hearts{display:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="caption" id="caption"></div>
  <button class="pause" id="pause" aria-label="Pause to read"><i><svg viewBox="0 0 10 10" id="pico"><rect x="1" y="0" width="3" height="10"/><rect x="6" y="0" width="3" height="10"/></svg></i><span id="ptxt">Pause to read</span></button>

  <div class="env" id="env">
    <svg class="back" viewBox="0 0 100 64" preserveAspectRatio="none"><rect class="poly" width="100" height="64"/></svg>
    <div class="card"><span id="cardText"></span></div>
    <svg class="front" viewBox="0 0 100 64" preserveAspectRatio="none">
      <polygon class="poly" points="0,0 50,34 0,64"/><polygon class="poly" points="100,0 50,34 100,64"/><polygon class="poly" points="0,64 50,34 100,64"/>
    </svg>
    <div class="flap"><svg viewBox="0 0 100 36" preserveAspectRatio="none"><polygon class="poly" points="0,0 100,0 50,36"/></svg></div>
    <div class="seal"><svg viewBox="0 0 24 22"><path fill="currentColor" d="M12 21.5C5 15.5 1 12 1 7.2 1 3.8 3.6 1.5 6.6 1.5c2.2 0 4.2 1.3 5.4 3.3 1.2-2 3.2-3.3 5.4-3.3C20.4 1.5 23 3.8 23 7.2c0 4.8-4 8.3-11 14.3z"/></svg></div>
  </div>

  <div class="letter" id="letter"></div>
  <div class="hearts" id="hearts"></div>
  <div class="footer" id="footer"></div>
</div>

<script>
/* ============ EDIT YOUR TEXT HERE ============ */
const CONFIG = {
  caption:  "When your love letter is a little extra 🥹💖",
  cardText: "To my love",
  letter: [
    "Happy birthday, my boupaakhii ❤️",
    "Amar khub kharap lgtese, I won’t be beside you today to see your beautiful smile, hold your hands, hug you, or be the first to wish you in person. I’ll be at the academy, surrounded by duties. Ami onk doa korisilam jeno ami tmr bday ta dhorte pari kintu Allah amake sei sujog dei nai.",
    "I wish, ami tmke ghum theke tultam, look into your eyes, lomba ekta hug ditam, listen to your endless talks, annoy you a little, and make you feel like the most loved girl in the world. With you, even the smallest moments become memories I want to keep forever.",
    "Paakhi, ami jdio onk peray thaki academy er but, you’re still the person my heart looks for during the day, tmke saradin er sob kotha bolte mon chat, ki ki hoise, amr sob kisu, moner vitre ja ase sob.",
    "You’ve supported me through difficult times, stayed beside me when life felt overwhelming, and loved me even when I wasn’t easy to deal with. I may never fully explain how precious you are to me, tmke pawa amar life er sob cheye boro luck, I’m so so lucky to have such a understanding, gentle, hearing, caring, beautiful boupaakhii.",
    "On your birthday, ami doa kori, tmr life er sokol koshto komuk, tmr dil ta jeno Allah mojbut kore, that you achieve every dream in your heart, and that you never lose the cuteness and gentleness that makes you “you”. May Allah protect you, give you peace, and fill your life with endless reasons to smile. And etao doa kori, Allah jeno amake tmr next birthday gulo te uposthik thakar sujog kore dek.",
    "I want the birthdays when we no longer count the days until we meet, when I can come home, hold you close, kiss your forehead, and wish you without having to leave again for the academy. I want the ordinary days with you too—the quiet, everyday moments that make a life together.",
    "Until then, keep a little place for me beside you. Imagine me hugging you tightly, kissing your forehead, and whispering, “Happy birthday, my gulumuluu shundori paakhii. I’m so lucky I get to love you.”",
    "I’m sorry I can’t be there physically this time, my love. Distance may keep my arms away for a while, but ami tmr sathe sob somoy i asii.",
    "Happy birthday to my favourite person, my peace, my happiness, my Paakhi ❤️",
    "Thank you for being you, for loving me, and for being part of my life. I love you more than these words could ever hold. When I see you again, I’ll make up for every hug, kiss, and moment I missed today.",
    "Keep smiling for me, shundori paakhi. Take care of yourself, eat properly, don’t overthink, and remember that somewhere inside this academy is a boy wishing more than anything to be beside you.",
    "Happy birthday, my Paakhi. My today, my tomorrow, and hopefully, all my forever ❤️",
    "Eti,\nApnar adorer jamaii ❤️"
  ],
  footer: "",              // small text at the bottom (leave empty to hide)
  readSeconds: 0,          // 0 = auto (based on letter length)
  loop: true               // false = play once and stay closed
};
/* ============================================= */

const $ = id => document.getElementById(id);
const stage = $('stage'), env = $('env'), letter = $('letter'), hearts = $('hearts');
$('caption').textContent = CONFIG.caption;
$('cardText').textContent = CONFIG.cardText;
$('footer').textContent = CONFIG.footer;
CONFIG.letter.forEach(t => { const p = document.createElement('p'); p.textContent = t; letter.appendChild(p); });

const sleep = ms => new Promise(r => setTimeout(r, ms));
let paused = false;
$('pause').onclick = () => {
  paused = !paused;
  $('ptxt').textContent = paused ? 'Resume' : 'Pause to read';
  $('pico').innerHTML = paused ? '<polygon points="1,0 10,5 1,10"/>' : '<rect x="1" y="0" width="3" height="10"/><rect x="6" y="0" width="3" height="10"/>';
};

function burst(n = 14) {
  const cols = ['#e5566b', '#d03a40', '#ff8f9e', '#ffb0bb'];
  for (let i = 0; i < n; i++) {
    const h = document.createElement('b');
    h.textContent = '♥';
    h.style.left = (12 + Math.random() * 76) + '%';
    h.style.top = (38 + Math.random() * 30) + '%';
    h.style.fontSize = (16 + Math.random() * 34) + 'px';
    h.style.color = cols[i % cols.length];
    h.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
    h.style.animationDelay = (Math.random() * 1.2) + 's';
    hearts.appendChild(h);
    setTimeout(() => h.remove(), 4200);
  }
}

async function hold() {
  const words = CONFIG.letter.join(' ').split(/\s+/).length;
  let left = (CONFIG.readSeconds || Math.max(8, 4 + words * 0.28)) * 1000;
  while (left > 0) { await sleep(100); if (!paused) left -= 100; }
}

async function play() {
  do {
    burst(); await sleep(2600);
    env.classList.add('open');            await sleep(800);
    env.classList.add('up');              await sleep(1000);
    env.classList.add('front');           await sleep(900);
    stage.classList.add('reading');       await sleep(1000);
    await hold();
    stage.classList.remove('reading');    await sleep(900);
    env.classList.remove('front');        await sleep(900);
    env.classList.remove('up');           await sleep(900);
    env.classList.remove('open'); env.classList.add('closing'); await sleep(800);
    env.classList.remove('closing');
    burst(10); await sleep(1800);
  } while (CONFIG.loop);
}
play();
</script>
</body>
</html>
